[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "regression-framework"
version = "2.0.0"
description = "Config-driven regression testing framework with parallel execution, retries, run history and HTML/JUnit reports."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "Jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
regress = "regression_framework.cli:main"

[tool.setuptools.packages.find]
include = ["regression_framework*"]

[tool.setuptools.package-data]
regression_framework = ["templates/*.j2"]

# ---------------------------------------------------------------- PyTest
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
markers = ["regression: runs the YAML/JSON regression suites through PyTest"]

# ---------------------------------------------------------------- Coverage
[tool.coverage.run]
source = ["regression_framework"]
omit = ["regression_framework/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true

# ---------------------------------------------------------------- Ruff (linter)
[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
